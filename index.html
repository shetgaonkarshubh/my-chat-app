
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Self Chat</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Self Chat">
</head>
<body>
    <div id="app">
        <aside id="sidebar">
            <header>
                <h2>My Chats</h2>
                <button id="add-room-btn">+</button>
            </header>
            <ul id="room-list"></ul>
        </aside>
        <main id="chat-area">
            <header id="chat-header">
                <h3 id="current-room-title">Select a room</h3>
            </header>
            <div id="messages-container"></div>
            <form id="message-form">
                <!-- Hidden file input for attachment -->
                <input type="file" id="media-input" accept="image/*,video/*" style="display: none;">
                <button type="button" id="attach-btn">📎</button>
                
                <input type="text" id="message-input" placeholder="Type a message..." autocomplete="off">
                <button type="submit">Send</button>
            </form>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
