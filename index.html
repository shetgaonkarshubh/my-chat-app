<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Self Chat</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Self Chat">
</head>
<body>
    <div id="app">
        <aside id="sidebar">
            <header>
                <h2>My Chats</h2>
                <div class="header-actions">
                    <button id="sync-settings-btn" title="Sync Settings">⚙️</button>
                    <button id="add-room-btn">+</button>
                </div>
            </header>
            <ul id="room-list"></ul>
        </aside>
        <main id="chat-area">
            <!-- Normal Chat Header -->
            <header id="chat-header">
                <button id="back-btn">←</button>
                <h3 id="current-room-title">Select a room</h3>
            </header>

            <!-- Selection Mode Header (Hidden by default) -->
            <header id="selection-header" class="hidden">
                <div class="selection-info">
                    <button id="cancel-selection-btn">✕</button>
                    <span id="selected-count">0 selected</span>
                </div>
                <button id="delete-selected-btn" class="action-btn-danger">🗑️ Delete</button>
            </header>

            <div id="messages-container"></div>

            <form id="message-form">
                <input type="file" id="media-input" accept="image/*,video/*" style="display: none;">
                <button type="button" id="attach-btn">📎</button>
                <input type="text" id="message-input" placeholder="Type a message..." autocomplete="off">
                <button type="submit">Send</button>
            </form>
        </main>
    </div>

    <!-- Message Context Dropdown Menu -->
    <div id="message-context-menu" class="context-menu hidden">
        <button id="menu-edit-btn">✏️ Edit</button>
        <button id="menu-select-btn">☑️ Select</button>
        <button id="menu-delete-btn" class="menu-danger">🗑️ Delete</button>
    </div>

    <!-- Sync Settings Modal -->
    <div id="sync-modal" class="modal hidden">
        <div class="modal-content">
            <h3>GitHub Gist Sync</h3>
            <label for="gh-token-input">GitHub Token:</label>
            <input type="password" id="gh-token-input" placeholder="ghp_xxxxxxxxxxxx">
            
            <label for="gist-id-input">Gist ID (leave blank to auto-create):</label>
            <input type="text" id="gist-id-input" placeholder="Auto-generated on first sync">
            
            <div class="modal-actions">
                <button id="save-sync-btn">Save Credentials</button>
                <button id="run-sync-btn">Sync Now 🔄</button>
                <button id="close-modal-btn">Close</button>
            </div>
            <p id="sync-status"></p>
        </div>
    </div>

    <script src="localforage.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
