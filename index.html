<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Self Chat</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css?v=4">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Self Chat">
</head>
<body>
    <div id="app">
        <aside id="sidebar">
            <header>
                <h2>My Chats</h2>
                <div class="header-actions">
                    <button id="add-folder-btn" title="Create Folder">📁+</button>
                    <button id="add-room-btn" title="Create Chat">+</button>
                    <button id="sync-settings-btn" title="Settings">⚙️</button>
                </div>
            </header>
            <ul id="room-list"></ul>
        </aside>
        <main id="chat-area">
            <header id="chat-header">
                <button id="back-btn">←</button>
                <div class="header-title-wrap">
                    <h3 id="current-room-title">Select a room</h3>
                    <span id="current-room-folder" class="room-folder-tag"></span>
                </div>
                <button id="room-options-btn" title="Chat Settings">⋮</button>
            </header>

            <header id="selection-header" class="hidden">
                <div class="selection-info">
                    <button id="cancel-selection-btn">✕</button>
                    <span id="selected-count">0 selected</span>
                </div>
                <button id="delete-selected-btn" class="action-btn-danger">🗑️ Delete</button>
            </header>

            <div id="messages-container"></div>

            <form id="message-form">
                <input type="file" id="media-input" accept="image/*,video/*" style="display: none;">
                <button type="button" id="attach-btn">📎</button>
                <input type="text" id="message-input" placeholder="Type a message..." autocomplete="off">
                <button type="submit">Send</button>
            </form>
        </main>
    </div>

    <!-- Dropdown Menu -->
    <div id="message-context-menu" class="context-menu hidden">
        <button id="menu-edit-btn">✏️ Edit</button>
        <button id="menu-select-btn">☑️ Select</button>
        <button id="menu-delete-btn" class="menu-danger">🗑️ Delete</button>
    </div>

    <!-- Folder Action Modal -->
    <div id="folder-modal" class="modal hidden">
        <div class="modal-content">
            <h3 id="folder-modal-title">Folder Settings</h3>
            <div id="folder-modal-body"></div>
            <div class="modal-actions">
                <button id="close-folder-modal-btn" class="action-btn-secondary">Close</button>
            </div>
        </div>
    </div>

    <!-- Settings & Sync Modal -->
    <div id="sync-modal" class="modal hidden">
        <div class="modal-content">
            <h3>App Settings</h3>
            
            <label for="theme-select">🎨 Color Theme:</label>
            <select id="theme-select">
                <option value="default">Classic (Teal & Grey)</option>
                <option value="black-red">1. Black & Red</option>
                <option value="blue">2. Light & Dark Blue</option>
                <option value="yellow-orange">3. Yellow & Orange</option>
                <option value="pink-purple">4. Pink & Purple</option>
                <option value="black-white">5. Black & White (OLED)</option>
            </select>

            <label for="gh-token-input" style="margin-top: 8px;">GitHub Token:</label>
            <input type="password" id="gh-token-input" placeholder="ghp_xxxxxxxxxxxx">
            
            <label for="gist-id-input">Gist ID (leave blank to auto-create):</label>
            <input type="text" id="gist-id-input" placeholder="Auto-generated on first sync">
            
            <div class="modal-actions">
                <button id="save-sync-btn">Save Settings</button>
                <button id="run-sync-btn">Sync Now 🔄</button>
                <button id="close-modal-btn">Close</button>
            </div>
            <p id="sync-status"></p>
        </div>
    </div>

    <script src="localforage.min.js"></script>
    <script src="app.js?v=4"></script>
</body>
</html>
